notests *default:
  build:
    target: Vostok.Logging.Tracing.sln
    configuration: NoTests
    tool:
      name: dotnet

  install:
    - Vostok.Logging.Tracing/bin/Release/netstandard2.0/Vostok.Logging.Tracing.dll
    - module vostok.logging.abstractions
    - module vostok.tracing.abstractions
    - groups:
        - target-framework: "netstandard2.0"
          libraries:
            - Vostok.Logging.Tracing/bin/Release/netstandard2.0/Vostok.Logging.Tracing.dll
          modules:
            - name: vostok.logging.abstractions
            - name: vostok.tracing.abstractions
        - target-framework: "net6.0"
          libraries:
            - Vostok.Logging.Tracing/bin/Release/net6.0/Vostok.Logging.Tracing.dll
          modules:
            - name: vostok.logging.abstractions
            - name: vostok.tracing.abstractions
        - target-framework: "net8.0"
          libraries:
            - Vostok.Logging.Tracing/bin/Release/net8.0/Vostok.Logging.Tracing.dll
          modules:
            - name: vostok.logging.abstractions
            - name: vostok.tracing.abstractions

  deps:
    - vostok.devtools
    - vostok.logging.abstractions
    - vostok.tracing.abstractions

full-build > notests:
  install:
    - Vostok.Logging.Tracing/bin/Release/netstandard2.0/Vostok.Logging.Tracing.dll
    - module vostok.logging.abstractions
    - module vostok.tracing.abstractions
    - groups:
        - target-framework: "netstandard2.0"
          libraries:
            - Vostok.Logging.Tracing/bin/Release/netstandard2.0/Vostok.Logging.Tracing.dll
          modules:
            - name: vostok.logging.abstractions
            - name: vostok.tracing.abstractions
        - target-framework: "net6.0"
          libraries:
            - Vostok.Logging.Tracing/bin/Release/net6.0/Vostok.Logging.Tracing.dll
          modules:
            - name: vostok.logging.abstractions
            - name: vostok.tracing.abstractions
        - target-framework: "net8.0"
          libraries:
            - Vostok.Logging.Tracing/bin/Release/net8.0/Vostok.Logging.Tracing.dll
          modules:
            - name: vostok.logging.abstractions
            - name: vostok.tracing.abstractions

  deps:
    - -vostok.devtools
    - vostok.devtools@with-net6.0

  build:
    target: Vostok.Logging.Tracing.sln
    configuration: Release